# Builds the web bundle and publishes dist/ to GitHub Pages on every push to
# main. One-time setup: in repo Settings → Pages, set Source to "GitHub
# Actions" (not "Deploy from a branch"). The VITE_SUPABASE_* values come from
# GitHub Actions repository variables; they are public browser identifiers.
# Supabase deployment authority is a repository secret and the project ref is
# an explicit repository variable. Pages never advances unless the matching
# `narrate` Edge function deployment succeeds first.
#
# `npm run build` is the only build target now — the artifact (singlefile)
# build path was dropped when the handcrafted map moved to Supabase, so
# `build:web` no longer exists.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1.2 verifier integrity is anchored to deployed commit d925c35
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 needs Node ^20.19 || >=22.12
          cache: npm
      - run: npm ci

      - name: Check Supabase browser configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL repository variable"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing VITE_SUPABASE_ANON_KEY repository variable"; exit 1; }
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-narrate:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Check Supabase Edge deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF repository variable"; exit 1; }
      - name: Deploy matching narrate Edge contract
        run: supabase functions deploy narrate --project-ref "$SUPABASE_PROJECT_REF"

  deploy:
    needs: deploy-narrate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
