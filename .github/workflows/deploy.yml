# Publishes the clean-room Godot mechanical RPG as the GitHub Pages root.
# The checked-in pages/ directory is the deterministic Godot Web export; the
# legacy React bundle is no longer the public site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Godot Web artifact
        shell: bash
        run: |
          test -s pages/index.html
          test -s pages/index.js
          test -s pages/index.pck
          test -s pages/index.wasm
          grep -q 'Solitaire — Whitemarch' pages/index.html
          grep -q '"executable":"index"' pages/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
