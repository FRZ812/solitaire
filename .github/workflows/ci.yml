# Build gate on every push and pull request. The deploy workflow (deploy.yml)
# handles publishing on main.

name: CI

on:
  push:
    branches-ignore: [main] # main is covered by deploy.yml's build job
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1.2 verifier integrity is anchored to deployed commit d925c35
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 needs Node ^20.19 || >=22.12
          cache: npm
      - run: npm ci
      - run: npm run build
