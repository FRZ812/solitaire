f a circuit of the Hold. The view is good; the wardens are talkative, in their slow careful way."},vistaRadius:5},"12,-4":{terrain:"settlement",poi:{type:"square",name:"Council Ring",description:"A circle of long flat stones, used for the open council. Any Halfborn may speak; the matriarchs hear, weigh, and answer. Outsiders may petition by raising a hand and waiting until called."}},"11,-4":{terrain:"indoor",poi:{type:"smithy",name:"Halfborn Forge",description:"A working forge run by a half-orc smith of much repute. She has shod, hammered, and re-welded most of the iron the Hold owns. Three apprentices; three more on a year's waiting list."}},"13,-4":{terrain:"indoor",poi:{type:"inn",name:"The Broken Ring",description:"The Hold's only inn, named for the broken iron-rings of Sundered Crown wargear that hang from its beams. Plain food, strong beer; the gathering point for caravan-passers and the place to hire honest blades cheap."}},"12,-5":{terrain:"indoor",poi:{type:"hall",name:"Forge of Agreement",description:"A larger ceremonial hall, with a stone forge at its centre — used in the Hold's binding rites. Marriages, partnerships, peace-treaties: a token is heated, struck, and cooled in the bound parties' presence. The cooled iron goes home with each side."}},"11,-5":{terrain:"indoor",poi:{type:"hall",name:"Freed-Hall",description:"A long-hall where the recently freed are housed and fed until they decide where to go next. Some stay; some don't. The hall has fed and lodged a thousand who later remembered it kindly."}},"13,-5":{terrain:"indoor",poi:{type:"shop",name:"Stores",description:"A common store-house, stocked by collective effort and drawn from at need. The store-keeper records taken-and-given in a single ledger, never balanced and never demanded to balance."}},"12,-6":{terrain:"indoor",poi:{type:"throne_room",name:"Matriarch's Hall",description:"The hall of the elected Matriarch — currently a tall, broad-shouldered Halfborn in her fifth year of office. She holds court at a long table, not a throne, and prefers questions to petitions. Outsiders are heard out and often answered same-day."}},"-20,-10":{terrain:"hills",poi:{type:"shrine",name:"Standing Stones of Anwen",description:"A circle of nine standing stones on a low rise. The outer ring is silent; the centre hums faintly to those attuned to leyline. Three small altars at the ring's western edge — older than the stones, perhaps."},vistaRadius:5},"-19,-10":{terrain:"hills",poi:{type:"shrine",name:"The Old Altars",description:"Three flat altar-stones older than the standing ring — half-buried, lichened, scarred at one edge. Old offerings of copper, hawthorn-berry, knotted hair have been left by hands long gone."}},"-21,-10":{terrain:"hills",poi:{type:"landmark",name:"Dawn-Aligned Passage",description:"A low passage between two of the standing stones, oriented exactly to the midwinter sunrise. On that morning the light passes through and strikes the centre stone; on every other morning it merely points."}},"-20,-11":{terrain:"hills",poi:{type:"shrine",name:"The Centre Stone",description:"The largest of the nine stones, set in the middle of the ring. It hums in the bones of those who fast there a dawn and a dusk. Many have fasted; few have woken with anything; some have woken with everything."}},"-20,-9":{terrain:"hills",poi:{type:"hidden",description:null}},"32,8":{terrain:"settlement",poi:{type:"yard",name:"Heron Tower Approach",description:"A path winding up to a stone tower set on a knoll above the foothills. A small walled courtyard at the base. The tower is plain on the outside; the windows are arranged in a way that does not quite match the floor-count."}},"31,8":{terrain:"road",poi:null},"33,8":{terrain:"indoor",poi:{type:"stable",name:"Tower Stable",description:"A small stable for the master's mount and any visitor's. Currently: one black mare with no patience for casual handling and a herald-bird's perch by the lantern-hook."}},"32,9":{terrain:"indoor",poi:{type:"hall",name:"Tower Hall",description:"The ground-floor hall — a long table, three chairs, a wide hearth. The master receives here when receiving at all. Three books on the table at any one time, never the same three."}},"32,10":{terrain:"indoor",poi:{type:"shop",name:"Tower Library",description:"A spiral stair leading to the library proper — three storeys of shelves running the inner wall of the tower. The cataloguing rule is private; the master finds anything within seconds; no one else finds anything in less than an afternoon."}},"32,11":{terrain:"indoor",poi:{type:"throne_room",name:"Master's Study",description:"The master's working room — a desk under a north-facing window, a heavy iron-bound chest beside it, a leather chair worn into the master's shape. The master of the Heron Tower, an old woman in plain grey, sits here most days and most nights."}},"33,11":{terrain:"indoor",poi:{type:"shrine",name:"The Observatory",description:"A small domed room at the tower's top. A brass quadrant, a polished black-stone scrying basin, a single high stool. The view from the parapet is sublime."},vistaRadius:12},"-18,-8":{terrain:"forest",poi:{type:"shrine",name:"The Fae Crossing",description:"A clearing in the Tannic Wood ringed with red-capped toadstools. At dusk the ring sometimes contains things that did not enter from outside it. A bargain struck here is binding in ways the Vale does not have words for."}},"-17,-8":{terrain:"forest",poi:{type:"landmark",name:"Hawthorn Watch",description:"A single hawthorn at the clearing's eastern edge, hung with strips of green and pale silver cloth left as offerings by previous visitors. The wind moves them more than the wind explains."}},"-19,-8":{terrain:"forest",poi:{type:"landmark",name:"Toadstool Ring",description:"The outer ring of red-capped toadstools, set so symmetrically the eye refuses to call them natural. Crossing the ring is a choice; crossing back is sometimes a gift."}},"-18,-9":{terrain:"forest",poi:{type:"shrine",name:"The Dusk-Altar",description:"A flat moss-stone in the clearing's centre. Offerings left here at twilight are sometimes gone by dawn — and sometimes the giver is too."}},"-18,-7":{terrain:"forest",poi:{type:"throne_room",name:"The Court of Hawthorn",description:"The inner glade — visible only when invited. A circle of tall pale folk in dim livery, the Hawthorn Lord at their centre. He is courteous, listens carefully, and offers a small thing for a small thing or a large thing for a large thing."}},"-8,-15":{terrain:"forest",poi:{type:"shrine",name:"Library of Old Tannic",description:"A library hidden in a clearing of black firs north of the Charwood Burn — the Wood-Cult's outer archive. The threshold is a moss-stone arch; visitors are catalogued before they catalogue any book."}},"-7,-15":{terrain:"indoor",poi:{type:"hall",name:"The Public Stacks",description:"The library's open hall — three rows of reading-tables, long shelves of mundane texts on plants, weather, the Cult's quiet histories. Anyone patient may read here. The Cult's librarians keep the silence."}},"-9,-15":{terrain:"indoor",poi:{type:"shop",name:"The Cataloguer's Desk",description:"Where new visitors register and where the trusted apply for inner-stack access. The cataloguer is a thin, courteous Wood-Cult brother who refuses no one — but refuses to hurry, and a Cult application takes a season."}},"-8,-16":{terrain:"indoor",poi:{type:"vault",name:"The Inner Library",description:"A locked side-room of grimoires lent only to the Cult's trusted readers. The titles on the spines are in five languages, two of them no longer spoken. The brothers take down what's been requested; visitors do not browse."}},"-8,-14":{terrain:"indoor",poi:{type:"shrine",name:"The Reader's Cell",description:"A small private reading cell with a desk, a lamp, and a comfortable chair. Grimoires lent from the Inner Library are read here, never elsewhere. The chair is older than the building."}},"-9,-16":{terrain:"indoor",poi:{type:"throne_room",name:"The Locked Stacks",description:"A small inner vault, opened only by the Master Archivist. Three locked cabinets. The Master Archivist will open the cabinets for the right student at the right hour; very few students have been right."}},"-12,12":{terrain:"hills",poi:{type:"ruin",name:"The Bloodline Cairn",description:"An old stone-and-turf barrow on the inner edge of Bramblewych Reach. The capstone at its head is carved with a pattern the eye keeps trying to resolve. Those whose blood already carries the thread are known to wake on the inner slab changed."}},"-11,12":{terrain:"forest",poi:{type:"landmark",name:"Approach Hawthorn",description:"A single ancient hawthorn at the cairn's eastern approach — older than the barrow, perhaps. Strips of cloth tied to its branches, left by those who have lain on the slab inside and woken."}},"-13,12":{terrain:"hills",poi:{type:"hidden",description:null}},"-12,13":{terrain:"indoor",poi:{type:"throne_room",name:"The Sleeping Slab",description:"Inside the cairn — a single stone slab, the length of a tall man, polished by centuries of seekers. Three carved blood-grooves run its length. The chamber smells of stone-dust and old hawthorn. Sleep here is a choice with consequences."}},"8,8":{terrain:"settlement",poi:{type:"shrine",name:"Shrine of the Pale God",description:"A small stone shrine on the southern edge of Crowsmoor Reach. Three thin pillars hold up a tiled roof; a stone wash-basin sits before the threshold. One of the Pale God's seven servants attends day and night."}},"7,8":{terrain:"road",poi:null},"9,8":{terrain:"indoor",poi:{type:"hall",name:"Servants' Quarters",description:"The seven small cells of the servants — one cell per servant of the seven-day cycle. Plain pallets, a single brass lantern shared, a copy of the Order's text on each desk."}},"8,9":{terrain:"indoor",poi:{type:"shrine",name:"Vigil Chamber",description:"A cold square chamber where the supplicant fasts and bleeds through the appointed hours. A single hard bench, a low stone bowl, a chalk line on the floor that no one but the supplicant may cross."}},"8,7":{terrain:"indoor",poi:{type:"throne_room",name:"The Altar",description:"The inner altar of the Pale God — a single curved stone the colour of unbleached linen. The Pale God answers, sometimes. The vigil is the asking; the answer (if it comes) is a quiet certainty in the supplicant, which they will know on rising."}},"10,-5":{terrain:"settlement",poi:{type:"camp",name:"The Travellers' Meet",description:"A neutral crossroads-market on a low knoll. In the ten-day fair-weeks four times a year, the green is crowded with tents, mules, and three different languages of haggling. In the long weeks between, three permanent fire-rings and a swept circle of ground wait."}},"9,-5":{terrain:"road",poi:null},"11,-5":{terrain:"road",poi:null},"10,-4":{terrain:"settlement",poi:{type:"stable",name:"Off-Season Stable",description:"A long open-sided shelter — three rows of hitching-rails, water-trough, hay-bales. Free use for any traveller, by the unwritten rule of the Meet. Theft from the stable is punished by community out-of-band."}},"10,-6":{terrain:"settlement",poi:{type:"landmark",name:"Long-Table",description:"A row of three trestle-tables under a wide awning, kept up between fair-weeks. The trestles are bolted to the ground; the awning is patched. Traveller meets traveller here, and stories are exchanged for tea."}},"22,5":{terrain:"hills",poi:{type:"landmark",name:"Stargazer's Hill",description:"A high knoll in Crowsmoor Reach with a small stone observatory at its crown. The view at night is the best for ten leagues. The astronomer in residence is of the Heron School and will explain anything if asked nicely."},vistaRadius:10},"21,5":{terrain:"plains",poi:{type:"landmark",name:"Star-Path",description:"A foot-path winding up the hill, marked with small white-painted stones at every dozen paces. Pilgrims (mostly children with their grandparents) follow it in clear evenings."}},"22,4":{terrain:"indoor",poi:{type:"shop",name:"The Quadrant Room",description:"A small room of the observatory — a brass quadrant on a stone pedestal, a row of star-charts, and a careful astronomer in plain grey who will mark a horoscope for a copper."}},"22,6":{terrain:"indoor",poi:{type:"throne_room",name:"The Lens Room",description:"The observatory's upper room — a single large polished-glass lens on a pivot, mounted to read the southern sky. The astronomer trains it on whatever the visitor asks; sometimes she trains it on what the visitor needs."}},"-15,0":{terrain:"settlement",poi:{type:"landmark",name:"Mendicant Bridge",description:"A timber bridge across a Mire-channel. A fire-pit under the western abutment — the mendicant's. He asks travellers for a story, not coin; he keeps the fire going through cold months."}},"-14,0":{terrain:"road",poi:null},"-16,0":{terrain:"indoor",poi:{type:"throne_room",name:"Mendicant's Hollow",description:"A small under-bridge hollow where the mendicant sleeps and writes. A single oiled book, half full, in which (he says) the stories he has been told are kept. He will read from it on request, if he likes you, if it is raining."}},"-30,148":{terrain:"settlement",poi:{type:"gate",name:"Asalan North Gate",description:"The North Gate of Asalan — three sets of doors, a double portcullis, and a queue of carts that begins forming three hours before dawn. Customs-officers in royal red collect duty and gossip in equal measure."}},"-31,149":{terrain:"settlement",poi:{type:"gate",name:"Asalan West Gate",description:"The West Gate — narrower, used mostly by Banner-couriers and the city's market-gardeners. The wall here is the original Asalan stone, two storeys high and never breached."}},"-29,149":{terrain:"settlement",poi:{type:"gate",name:"Asalan East Gate",description:"The East Gate — wider, for the great trade-caravans. A statue of the city's founding queen at the inner side; pigeons live in the crook of her arm."}},"-30,149":{terrain:"settlement",poi:{type:"yard",name:"Outer Plaza",description:"The first square inside the walls — wide stone paving, a fountain, four streets fanning out. The smell of the south: warm stone, jacaranda blossom, charcoal-smoke."}},"-30,150":{terrain:"settlement",poi:{type:"city",name:"Asalan",description:"Seat of the Vale-King — a southern walled city of warm honey-coloured stone, jacaranda streets, and a population of forty thousand. The Crown's writ runs the southern provinces; the city is the writ's heart."}},"-31,150":{terrain:"settlement",poi:{type:"yard",name:"Trade Quarter",description:"The largest of the city's quarters — three concentric markets around a central exchange. Spice, cloth, copper, salt-fish, books, wine, and (in season) the kingdom's famous oranges."}},"-29,150":{terrain:"settlement",poi:{type:"yard",name:"Temple Quarter",description:"A quarter of nine temples — one for each of the southern gods, plus the eighth and ninth, which are foreign and small and tolerated. Bells ring at conflicting intervals all day."}},"-30,151":{terrain:"settlement",poi:{type:"yard",name:"Workshops Quarter",description:"Where the city makes the things the city sells. Bronze-smiths' lane, glassblower's row, the leather-yards, the textile sheds. The noise is famous; the apprentices are famous-er."}},"-30,152":{terrain:"settlement",poi:{type:"gate",name:"Royal Court Gate",description:"The gate to the inner city — a pair of bronze-bound oak doors, guards in royal red and pale linen. Petitioners queue at a side door, by appointment; merchants come and go through the main gate."}},"-31,151":{terrain:"indoor",poi:{type:"shop",name:"The Royal Library",description:"Asalan's royal library — three storeys of polished cedar shelves, a thousand titles in the open stacks, more in the locked. The Royal Librarian is an elderly courteous man who has read most of what he keeps."}},"-29,151":{terrain:"indoor",poi:{type:"hall",name:"Mages' Court",description:"The Royal Court's small school of sorcery — not the Glass Spire, but Asalan keeps a handful of court-mages who train one or two apprentices apiece. Library, study-rooms, an indifferent practice-yard."}},"-31,152":{terrain:"indoor",poi:{type:"shop",name:"The Royal Mews",description:"Where the Crown's hawks, courier-doves, and the kingdom's two trained eagles are kept. The Falconer-Royal is a slight woman with a perpetual leather glove; the birds love her."}},"-29,152":{terrain:"indoor",poi:{type:"hall",name:"Privy Council Chamber",description:"A long polished room where the Vale-King meets his Privy Council. A single round oak table, twelve chairs, a wide south-facing window. The Council meets daily in the second hour after dawn."}},"-30,153":{terrain:"indoor",poi:{type:"throne_room",name:"The Vale-King's Throne",description:"The Throne Hall of Asalan. A long stone hall, sun-lit through clerestory windows; the throne itself a chair of polished sandstone on a dais of three steps, draped in royal red. The Vale-King sits on petition-mornings and at the rare full court; he is courteous, slow, and very hard to mislead."}},"-31,153":{terrain:"indoor",poi:{type:"hall",name:"King's Solar",description:"The Vale-King's private solar — a sun-warmed room above the throne hall, where the King reads and dictates between audiences. Three chairs; a single south window; a wine-cup on the desk usually half full."}},"-29,153":{terrain:"indoor",poi:{type:"hall",name:"Queen's Chambers",description:"The Queen-Consort's private chambers — a suite of three rooms, sun-bright and well-loved. The Queen, when in residence, holds her own small court here for the kingdom's matrons and the city's heads-of-house."}},"-30,154":{terrain:"indoor",poi:{type:"vault",name:"Royal Vault",description:"The kingdom's treasury — beneath the throne hall, guarded around the clock. The royal regalia (a single crown of plain silver, a sceptre of jade) live here when not in use, which is most days."}},"-30,147":{terrain:"road",poi:null},"-31,148":{terrain:"road",poi:null},"-29,148":{terrain:"road",poi:null},"-201,49":{terrain:"forest",poi:{type:"gate",name:"Canopy Gate",description:"A gate of woven living branches arching over the inland road. Two Selenyan wardens; a single polished stone underfoot inscribed with the Selenyan glyph for welcome."}},"-199,49":{terrain:"forest",poi:{type:"landmark",name:"Singer Court",description:"A circular court where Selenyan singers practise in the long evenings. A polished spiral of moss-stone underfoot; benches of carved oak for those listening."}},"-200,50":{terrain:"forest",poi:{type:"city",name:"Caer Selenya",description:"The tree-built city of the Selenyan Court. Spires of living wood rise from the floor of an ancient forest; bridges of woven branch span the canopies. The city has stood, by Selenyan reckoning, eleven ages."}},"-201,50":{terrain:"forest",poi:{type:"yard",name:"Archer Court",description:"A long oval clearing kept for the city's archery — both ritual and practical. The straw targets are renewed at the first of every season; the discarded targets are burned with ceremony."}},"-199,50":{terrain:"forest",poi:{type:"yard",name:"Bowyer Court",description:"Where the city's master bowyers work, slowly, over years. A single bow may take seven seasons; the bow is named for the maker and the year of completion."}},"-200,51":{terrain:"indoor",poi:{type:"hall",name:"The Council of Names",description:"A great hall under the canopy — the city's central council. The walls are inscribed (still being inscribed) with every Selenyan name spoken in Caer Selenya since the city's founding. The Council reads names aloud at the changing of every season."}},"-201,51":{terrain:"indoor",poi:{type:"shop",name:"The Library of Leaves",description:"A library whose 'books' are pressed and bound leaves, each leaf inscribed with a Selenyan record in glyph and quiet ink. The catalogue is in the librarian's head; the librarian has held the post seven hundred years."}},"-199,51":{terrain:"indoor",poi:{type:"garden",name:"The Mirror Pool",description:"A circular pool of perfectly still water at the city's heart — the Selenyans consult it on questions they do not wish to ask aloud. The pool gives no answer in words; what visitors see in it differs between visitors."}},"-200,52":{terrain:"indoor",poi:{type:"hall",name:"The High Glades",description:"The roofless inner court of the city — a circle of immense ash-trees with their lower branches woven into a vaulted ceiling. The Council meets here on the highest matters. The acoustics are deliberate; a whisper carries."}},"-201,52":{terrain:"indoor",poi:{type:"shrine",name:"The Star-Reader's Glade",description:"A small private clearing kept clear of canopy. The city's chief star-reader receives here in the long evenings. The same flat moss-stone serves as her seat and her instrument."}},"-199,52":{terrain:"indoor",poi:{type:"armoury",name:"The Bow-Vault",description:"A locked chamber where the city's named bows are stored when their makers or owners are abroad. Three hundred bows, each in its own velvet sleeve; the room is colder than the city, and quiet."}},"-200,53":{terrain:"indoor",poi:{type:"throne_room",name:"The Speakers' Spire",description:"The Spire — a single tall living-wood tower at the city's centre. The Speaker-of-the-Court (the Selenyan kindred's nearest equivalent to a queen, though they would correct the word) holds court at its top. A circular room of polished pale wood; a low cushion; a view that takes in the whole canopy."}},"-201,53":{terrain:"indoor",poi:{type:"hall",name:"The Counsellors' Room",description:"Below the Speaker's chamber, a hall for the Court's permanent counsellors. Seven seats, a polished wood floor, a single round table. The Counsellors brief the Speaker each morning and answer her questions each evening."}},"-199,53":{terrain:"indoor",poi:{type:"shrine",name:"The Memory-Branch",description:"A single carved branch hung from the Spire's central beam, inscribed with the names of every Speaker-of-the-Court since the founding. New names are added by the next Speaker, when she takes the post."}},"-200,48":{terrain:"forest",poi:{type:"landmark",name:"Outer Welcoming",description:"The first clearing inside the city's outer trees — visitors rest here while a courier carries word to the Council. A long wooden bench, three deep cups of clear water set on a low table when expected."}},"-200,54":{terrain:"forest",poi:{type:"shrine",name:"The Dawn Wall",description:"The eastern edge of the inner city — a wall of living birches kept pale by careful attention. Selenyan custom: visitors who depart at dawn touch the wall once before leaving, and are remembered."}},"89,-89":{terrain:"water",poi:{type:"landmark",name:"Lake Crossing",description:"A landing-stage on the shore of a lake no two maps draw the same. Three flat-bottomed boats and a single ferryman who works for whatever the Spire pays him, which is little but punctual."}},"91,-89":{terrain:"water",poi:{type:"landmark",name:"Spire Approach",description:"The lake's calm middle reach. From here the Glass Spire is fully visible — a single pale tower rising from a small island. The tower's surfaces refract sunlight into shifting bands no two visitors describe alike."}},"90,-90":{terrain:"settlement",poi:{type:"fortress",name:"The Glass Spire",description:"The fabled academy of sorcerers — a single tower of pale fused glass, two hundred feet tall, on an island in a lake no map agrees on. The threshold is a single iron-bound oak door at the tower's base. Visitors knock and are let in by a porter who looks tired and unsurprised."},vistaRadius:20},"89,-90":{terrain:"indoor",poi:{type:"hall",name:"The Porter's Hall",description:"The Spire's ground-floor hall — a long stone room, a single fire, three plain benches for waiting. The porter (an elderly sorcerer who took the post to keep his hands busy) takes names and ages of visitors and disappears upstairs for ten minutes at a time."}},"91,-90":{terrain:"indoor",poi:{type:"shop",name:"The Scriptorium",description:"Where the Spire's apprentices spend their first years copying. Three rows of high desks under tall north windows. The smell of ink and binder's glue and old paper, never quite the same intensity."}},"90,-91":{terrain:"indoor",poi:{type:"shop",name:"The Library Wing",description:"The Spire's working library — three storeys of shelves spiralling up the tower's inner wall. The cataloguing is by colour, smell, and an internal logic only librarians grasp. New apprentices need a week to find anything."}},"89,-91":{terrain:"indoor",poi:{type:"shrine",name:"The Scrying Wing",description:"A floor of the tower dedicated to scrying — basins of black water on stone pedestals, copper mirrors in iron frames, a long bench of star-glass spheres. Apprentices learn here under the eye of the Master-of-Mirrors."}},"91,-91":{terrain:"indoor",poi:{type:"shrine",name:"The Summoning Wing",description:"A heavily-warded floor for the Spire's higher work. The chalk-circles in the floor are reinforced by silver inlay. Visitors are not admitted; apprentices are admitted after seven years, occasionally."}},"90,-92":{terrain:"indoor",poi:{type:"shrine",name:"The Open Eye",description:"An observatory at the Spire's penultimate floor — open to the sky through a retracting copper-and-leaded-glass dome. The Open Eye is for star-work and for the long calculations the Spire's masters love."},vistaRadius:8},"90,-93":{terrain:"indoor",poi:{type:"throne_room",name:"The High Master's Chamber",description:"The topmost room of the Glass Spire. A single round chamber under the tower's apex. A low desk, a single high-backed chair, a wide circular window. The High Master, an elderly figure of indeterminate gender, sits and reads and occasionally writes letters that change kingdoms."}}},_r={"-5,-25":{name:"Black Tarn",kind:"lake",direction:"northwest",description:"A deep, lightless lake. Old stories cling to it; the locals do not fish it."},"-10,-15":{name:"The Hollow Pines",kind:"ruin",direction:"north",description:"An ancient yew copse older than the names of kings. Nothing has been cut from them in living memory."},"-8,-10":{name:"Goblin Hollow",kind:"den",direction:"northwest",description:"A warren of bramble-choked tunnels above a stream. Children of the Mire are told to never come here after dark. Locals say one goblin-band lives there; travellers swear there are three."},"5,-12":{name:"The Tannic Ford",kind:"landmark",direction:"north",description:"Where the wagon-track meets the Tannic. A ferry-house was burned out four winters ago and never rebuilt; horses still ford it in low water."},"-3,-18":{name:"Charwood Burn",kind:"ruin",direction:"north",description:"A long blackened scar through the Tannic Wood — a forest fire of decades past, never quite regrown. The Wood-Cult will not enter it."},"-15,-20":{name:"Brokenglass Tower",kind:"ruin",direction:"northwest",description:"A blade of green glass thrusting from a low ridge — said to be the upper half of a tower the rest of which fell, or never was."},"-12,-28":{name:"The Witch-Hag's Cot",kind:"ruin",direction:"north",description:"A single tilted chimney on the edge of the Bonemarsh. Older than living memory, never quite empty."},"12,-8":{name:"Pilgrim's Rest",kind:"village",direction:"northeast",description:"A way-village on the Whitemarch road. Two inns, a chapel, a graveyard kept neater than the houses."},"20,-10":{name:"Skyflash Tower",kind:"fortress",direction:"northeast",description:"A march-tower of the Whitemarch outriders. At dusk its signal-mirror flashes word to the city; lonely countryfolk set their clocks by it."},"25,-15":{name:"Beltsworn",kind:"village",direction:"northeast",description:"A frontier village halfway to Whitemarch, paid in coin to keep the road open."},"40,-20":{name:"Whitemarch",kind:"city",direction:"northeast",description:"A walled city. Said to be where the iron is minted."},"30,-30":{name:"The Cinder Chapter",kind:"fortress",direction:"northeast",description:"The chapter-house of the Burning Order. A bronze door, a perpetual fire, and recruits sent on toward the Drakeholt."},"18,5":{name:"The Burnt Croft",kind:"ruin",direction:"east",description:"A homestead burned to the foundation-stones some seasons back. A signpost still names the family; nobody has taken the signpost down."},"30,0":{name:"Hollyman's Crossing",kind:"village",direction:"east",description:"A small road-village with a smithy and a watering-trough older than the village. The road forks here — south toward the Spine, east toward the Plateau."},"15,15":{name:"Caer Drum",kind:"ruin",direction:"southeast",description:"A low broken hillfort of dressed grey stone. Spine herders pen winter sheep inside its outer wall."},"20,12":{name:"Mossbridge Hold",kind:"fortress",direction:"southeast",description:"A small stone tower-house holding the crossing of an unnamed beck. Manned in summer by a Spine-tribe sept; locked and shuttered in winter."},"25,20":{name:"Caer Aglyn",kind:"ruin",direction:"southeast",description:"An old hillfort, earthworks still visible in the right light. Said to have fallen to plague, not arms."},"35,25":{name:"The Spine",kind:"mountains",direction:"southeast",description:"A spine of broken stone rising from the southern plains."},"30,28":{name:"The Ogre Stair",kind:"den",direction:"southeast",description:"A switchback of carved stone steps too tall for a man. Spine scouts mark it on charts as RED and do not climb it."},"8,12":{name:"Hollow Cairn",kind:"ruin",direction:"south",description:"A burial-cairn split open by frost or hand. The slabs inside are carved with a script nobody alive reads aloud."},"5,18":{name:"Bramble Ferry",kind:"landmark",direction:"south",description:"A pole-ferry across a slow stretch of water at the edge of the Reach. The ferryman takes copper or a story; he is particular about which."},"-15,25":{name:"The Last King's Tomb",kind:"ruin",direction:"south",description:"The barrow of the last king to hold this country — a name no longer spoken in Crowsmoor."},"-20,30":{name:"The Old Wall",kind:"ruin",direction:"south",description:"A broken wall of black brick, long abandoned."},"-25,20":{name:"Bramblewych",kind:"village",direction:"southwest",description:"A village south of the Mire. Famous for nothing."},"0,35":{name:"Greypool",kind:"village",direction:"south",description:"A reed-built fishing village on the inland edge of the Hollow Coast. The Tideless visit twice a year and the village keeps its lamps shuttered those nights."},"-22,-3":{name:"Tannic Mill",kind:"village",direction:"west",description:"A milling-hamlet on a side-channel of the Tannic. The miller takes a tenth in flour and a thirteenth in talk."},"-25,10":{name:"Briarcross",kind:"village",direction:"west",description:"A crossroads-village in the Bramblewych. Hedge-witches teach there openly; the Wardens leave it alone."},"-30,-5":{name:"The Black Mound",kind:"ruin",direction:"west",description:"A black-earth tumulus the size of a barn. Locals warn that nothing planted near it grows; carrion crows nest on it summer-long."},"35,18":{name:"Stonebrook Hold",kind:"town",direction:"southeast",description:"A working dwarven hold in the Spine Foothills — a gate cut into a hillside, a smokehouse market-square below, three hundred stone-folk who keep a trade-tongue and a long memory. They buy iron, sell finished steel, and tolerate visitors who follow the posted rules."},"-15,8":{name:"Greenshaw",kind:"village",direction:"south",description:"A village of the small folk on the inland edge of the Bramblewych Reach. Trim hedges, bee-skeps, and houses with the doors set into the hillside. The Greenshaw keep careful neutrality with the Bramble Witches and feed any traveller who asks politely."},"-28,12":{name:"Selenyan Edge",kind:"village",direction:"southwest",description:"A border outpost of the Selenyan Court at the edge of the Witchwood Deep — a clearing of bowyer-trees, a low timber hall, and a wary patrol of two or three. Strangers are welcome to wait at the threshold; passage further west requires invitation."},"12,-3":{name:"Halfborn Hold",kind:"town",direction:"east",description:"A walled town of half-orcs and the freed-from-coffles, on rising ground above the Mire's eastern edge. The matriarchy governs by election; the smithy is busy; the gate is open by day and watched by night. Tribute-banners of three war-bands they helped break hang inside the main gate."},"-20,-10":{name:"The Standing Stones of Anwen",kind:"shrine",direction:"northwest",description:"A circle of nine standing stones on a low rise in the Tannic Wood. A leyline crosses the inner ring; those who fast at the centre stone for a dawn and a dusk have been known to wake with something they did not have. Most who try it wake with nothing."},"32,8":{name:"The Heron Tower",kind:"fortress",direction:"east",description:"A grey stone tower on a knoll in the Spine Foothills — the seat of a master of the Heron School of sorcery. The master takes one apprentice at a time and rejects most who ask. Letters arrive there by white-bird; apprenticeship is years, not months."},"-18,-8":{name:"The Fae Crossing",kind:"shrine",direction:"north",description:"A glade in the Tannic Wood where the Court of Hawthorn is said to hold their dusk-rites. Travellers who step inside the toadstool ring at twilight may be addressed by a thing that looks like a tall fair child. A bargain there is binding in ways the Vale does not have words for."},"-8,-15":{name:"The Library of Old Tannic",kind:"shrine",direction:"north",description:"A Wood-Cult library hidden in a clearing of black firs north of the Charwood Burn. The mundane stacks are open to any patient reader; the inner stacks hold grimoires that the Cult will lend to those they trust, after a season or two of trust-building."},"-12,12":{name:"The Bloodline Cairn",kind:"ruin",direction:"south",description:"An ancient stone-and-turf barrow at the inner edge of the Bramblewych Reach. The slab inside is older than the names of the bloodlines. Those whose blood already carries the thread are known to wake on it changed. Those whose blood does not, simply wake cold."},"8,8":{name:"Shrine of the Pale God",kind:"shrine",direction:"southeast",description:"A small stone shrine on the southern edge of Crowsmoor Reach, kept in seven-day shifts by an order of seven servants. The Pale God answers, sometimes, those who fast, bleed, and wait through the appointed vigil."},"10,-5":{name:"The Travellers' Meet",kind:"camp",direction:"east",description:"A neutral crossroads-market on a knoll between the Mire's edge and Crowsmoor Reach. Tents and wagons spring up for ten days four times a year; in between, a sturdy circle of cleared ground and three permanent fire-rings waits."},"22,5":{name:"Stargazer's Hill",kind:"landmark",direction:"east",description:"A high knoll in Crowsmoor Reach with a small stone observatory at its crown — three rooms, a brass quadrant, an astronomer of the Heron School in summer residence. The view at night is the best for ten leagues."},"-15,0":{name:"Mendicant Bridge",kind:"landmark",direction:"west",description:"A timber bridge across a Mire-channel west of the Inn. A kindly mendicant keeps a fire under it through the cold months and asks travellers for a story, not coin. Some say the stories are kept somewhere."}};function vf(e,t){return _r[`${e},${t}`]||null}const oi={"northstar-castle":{name:"The Northstar Castle",direction:"north, beyond the Tannic",kind:"fortress",coord:{x:30,y:-150},description:"The seat of the Demon King — said to stand where the polestar never sets and the snow never melts. Few who walked toward it have come back; none of those came back the same."},drakespire:{name:"Drakespire",direction:"north, in the Drakeholt",kind:"mountains",coord:{x:0,y:-130},description:"The highest peak of the Drakeholt — a single black tooth above the cloud-line where the old wyrms ans go around it by a week's detour rather than cross. Those who have crossed it speak softly and only when they cannot avoid the subject."},"sunken-crown":{name:"The Sunken Crown",direction:"southwest, past the Old Wall",kind:"ruin",coord:{x:-100,y:130},description:"An empire of the second age, drowned in a single night. Fisherfolk speak of towers visible at low tide, and bells that ring without rope."},"pillar-of-storms":{name:"The Pillar of Storms",direction:"south, on the Hollow Coast",kind:"ruin",coord:{x:10,y:160},description:"A black basalt lighthouse the height of a hill, half-eaten by the sea. Tideless priests tend it; on storm-nights its lantern is said to light by no hand at all."},glasslake:{name:"The Glasslake",direction:"south, beyond the Hollow Coast",kind:"lake",coord:{x:-50,y:180},description:"A lake the colour of bottle-glass, perfectly still. The Tideless will not name what they say lives under it. Fish drawn from it cook by themselves."},heartwood:{name:"The Heartwood",direction:"west, past the Witchwood Deep",kind:"ruin",coord:{x:-180,y:30},description:"A wood so old its trees walked once, and may again. The Bramble Witches will not enter past its outer ring of yew. It is said the first language is still spoken there, by those who never stopped speaking it."},"mole-halls":{name:"The Mole-Halls of Durnnoch",direction:"west, under the Pale Steppe",kind:"ruin",coord:{x:-150,y:-20},description:"An underground city carved by the stone-folk — the dwarves. Said to be still inhabited; said to be only the wind in great corridors. Three iron gates, two of them welded shut from within."},lichgate:{name:"The Lichgate",direction:"northwest, in the Bonemarsh",kind:"fortress",coord:{x:-130,y:-100},description:"The standing-place of the Pale Hand — a black archway in the middle of a bog that opens upon nothing the eye can quite resolve. The dead that walk the Bonemarsh come from there and return to there."},"cinder-throne":{name:"The Cinder Throne",direction:"high in the Drakeholt, beyond Drakespire",kind:"ruin",coord:{x:60,y:-160},description:"A seat of fused obsidian where, the Burning Order say, the first wyrm was unmade. The Order sends its champions there; few are heard from again, and the few who are speak in a voice that is not quite their own."},"empty-lighthouse":{name:"The Empty Lighthouse",direction:"far west, on a coast no one names",kind:"ruin",coord:{x:-220,y:90},description:"A white tower on a shore no living captain can chart twice. It has never not been lit; its keeper has never been found. Sailors who claim to have seen its light at sea give different bearings every time."},asalan:{name:"Asalan",direction:"far south, past the Hollow Coast",kind:"city",coord:{x:-30,y:150},description:"Seat of the Vale-King — a southern walled city of warm stone, jacaranda streets, and the only sitting human monarch the continent acknowledges. The Crown's writ runs the southern provinces; the Vale gets word from Asalan only twice a year, and answers it with a single courier in spring."},"caer-selenya":{name:"Caer Selenya",direction:"far west, on a coast no human cartographer has named twice",kind:"city",coord:{x:-200,y:50},description:"The tree-built city of the Selenyan Court — the elven kindred. Spires of living wood, bridges of woven branch, and the long Council of Names in the city's central grove. Visitors are extended every courtesy and very few invitations."},"glass-spire":{name:"The Glass Spire",direction:"east, in the marches beyond Tellmar",kind:"fortress",coord:{x:90,y:-90},description:"The fabled academy of sorcerers — a single tower of pale glass two hundred feet tall, on an island in a lake no map agrees on. The Heron School's masters were trained there; the school's masters' masters were too. The Spire takes new students by invitation, never by request."}};function kf(){return Object.values(oi).map(e=>`${e.name} (${e.kind}, ${e.direction})`).join("; ")}const Ch={};for(const e of Object.values(oi))Ch[`${e.coo VOICE
- Second person, present tense.
- Literary, restrained — closer to Le Guin or Cormac McCarthy than a D&D module.
- 1–3 short paragraphs per beat. Sensory, specific. Trust the silence.

CRITICAL FORMATTING — NARRATION VS DIALOGUE
- "narration" contains ONLY description, action, atmosphere. NO quoted speech. EVER.
- ALL spoken words go in "dialogues" (array, plural). One entry per speaker line.

WRONG:  narration: "The innkeeper says, 'Water's free.'"
RIGHT:  narration: "The innkeeper slides a cup forward, the clay scraping wood."

WORLD MECHANICS
- Tile grid at fine resolution: each hex is roughly 250m of ground — a single vantage, e.g. a stretch of road, a copse, a courtyard, the inn's common room.
- Towns and large features SPAN MANY tiles. The Drowned Inn is a tile, its yard another, its stable another. Crowsmoor is a cluster of buildings several kilometres east. NPCs are tied to specific tiles; walking past a building does NOT auto-reveal who is inside.
- "Hidden" tiles contain a random event when first visited.
- Vistas: some places (knolls, towers, mountain passes) reveal great distance when reached. The engine expands the player's sight automatically — you only need to describe what they take in from the vantage.
- Never end with "what do you do?".

STRUCTURE SPRAWL — DUNGEONS, FORTRESSES, AND MAJOR DENS ARE NEVER ONE TILE
The single-tile-per-vantage rule applies to interiors too. A castle is a gate hex, a courtyard hex, a great hall hex, an armoury hex, a cellar hex, a throne-room hex. A goblin den is an entrance hex, a guard-warren hex, a hoard hex, a king's hollow hex. The world data pre-places these rooms as handcrafted tiles; the player navigates between them via the map like any other tile, and the [STATE] line tells you which hex they are currently standing in.

Reading the world this way:
- The hex they entered IS the room. Narrate the inhabitants, the air, the loot they can see — at THIS hex, no further. Do not narrate what's two doors deeper unless the player asks or you describe a line of sight.
- Bosses, key NPCs, and major treasures live at INTERIOR hexes, not the threshold. "I enter the Northstar Castle" does NOT put the player face-to-face with the Demon King; it puts them under the portcullis, in the outer ward, with sentries to deal with. The throne room is several hexes deeper.
- A door opens or a stair descends only if the player walks (via map travel) to the next hex. You may describe such openings ("a corridor leads east toward firelight, a stair drops west into damp dark") so the player chooses, but the engine moves them, not you.
- When the player asks to push deeper without using the map ("I check the next room"), advance time minimally and describe the move in prose — but understand the engine still believes them to be standing at the same hex. Prefer to PROMPT them toward the map for spatial movement; you handle action within a hex.

Scale to the place. A wayside watchpost is 2–4 tiles. A goblin den or hillfort ruin is 5–12. A great fortress (Brokenhold, Northstar Castle, Bone Citadel, Drakespire, Lichgate, Mole-Halls) is 15–30+ tiles arranged in nested wards.

Anchor coords (the public-facing or threshold hex of each named structure):
- Close, settlements: Drowned Inn (0,0), Crowsmoor (25,0), Whitemarch (40,-20), Bramblewych (-25,20), Beltsworn (25,-15), Stonebrook Hold (35,18, dwarven), Greenshaw (-15,8, small folk), Selenyan Edge (-28,12, elven), Halfborn Hold (12,-3, half-orc free).
- Close, dungeons: Goblin Hollow (-8,-10), Brokenglass Tower (-15,-20), Witch-Hag's Cot (-12,-28), Caer Drum (15,15), Mossbridge Hold (20,12), Ogre Stair (30,28), Cinder Chapter (30,-30), Wolf-Pit (4,7).
- Close, magic-unlock sites — each maps to ONE of the magic acquisition paths above. When the player visits with the right intent, the narrator should honor the path:
  - Standing Stones of Anwen (-20,-10) — LEYLINE AWAKENING. Fast at the centre stone for a dawn and a dusk.
  - The Heron Tower (32,8) — MASTER'S TEACHING. Apprenticeship is years, not months.
  - The Fae Crossing (-18,-8) — PATRON PACT (fae). The Hawthorn Lord will deal.
  - Library of Old Tannic (-8,-15) — GRIMOIRE STUDY. Trust-building precedes access.
  - The Bloodline Cairn (-12,12) — BLOODLINE/ARTIFACT. Wakes those already carrying the thread.
  - Shrine of the Pale God (8,8) — PATRON PACT (god). Fast, bleed, vigil through the appointed hours.
- Fabled (the player will not arrive at these by ordinary travel; reference only):
  - Hostile/cold legends: Brokenhold (-120,-60), Northstar Castle (30,-150), Drakespire (0,-130), Bone Citadel (-100,-90), Lichgate (-130,-100), Mole-Halls (-150,-20), Sunken Crown (-100,130), Tellmar (200,0), Star-Forge (140,90), Heartwood (-180,30).
  - Peaceful royal legends: Asalan (-30,150, Vale-King), Caer Selenya (-200,50, Speaker of the Selenyan Court), Glass Spire (90,-90, wizards' academy / High Master).

RANDOM ENCOUNTERS
Each terrain has a spawn table (wolves and goblins in forest; brigands and goblins in hills; wargs in mountains; bog-hounds and fey in marsh; refugees and wild dogs on plains; merchants and brigands on roads; beggars, pickpockets, and rare cutthroats in settlements).

When the engine rolls an encounter, your prompt will include a line like:
[ENCOUNTER] kind: wolves; posture: hostile; flavor: "a pack of wolves, gaunt and hungry"

When you see this:
- Weave the encounter into your narration naturally during the journey or rest.
- Include the encounter in your output's "encounter" field with type="Random" and a flavorful note that names the kind.
- Honor the posture — hostile is a threat (player can fight/flee/parley), neutral is presence without intent, friendly is a meeting.
- Generic threats (wolves, goblins) don't need codex entries unless they become named or recurring. Named individuals (a hunter, a peddler) SHOULD be added to discoveries.characters if the player interacts meaningfully.

The engine decides WHAT appears; you decide HOW it unfolds dramatically. If the player rests in dangerous terrain (forest, marsh, hills, mountains) without precaution, you may also narrate an encounter drawing from the local spawn table — judgment call.

BIOMES
The world is divided into named regions. The state context names the player's current biome with a one-sentence description; weave its mood and detail into your prose without explicitly naming the biome unless the player asks. The same terrain feels different across biomes — a forest in the Tannic Wood is hushed and rooty; a forest in Bramblewych Reach is brambled and half-tame; a forest in the Spine Foothills clings to stone. NPCs from these regions speak with that flavor and may reference local features, dangers, or customs.

GEOGRAPHY KNOWN BY REPUTATION
The state context lists distant landmarks the player knows about as a regional native (cities, rivers, mountains). The player has NOT been there — only knows OF them. NPCs may reference them as common geography.

GEOGRAPHY KNOWN BY LEGEND
The state context also lists fabled places across the continent — the Demon King's castle in the far north, sunken kingdoms past the southern coast, the Iron City of Tellmar to the east, and others. These are hearth-stories the player has grown up with; they are NOT on the local map and will not be reached by ordinary travel. NPCs of every region know their names and can reference them as compass-points, omens, or as the destinations of pilgrims and exiles. Use them sparingly — to give the player a sense of the wider world and a direction worth dreaming of, not as plot machinery.

ATTRIBUTES — six per character, score 0 to 25+
SCORE IS THE MODIFIER. Everyone starts at 0 (untrained baseline) and accumulates through life, training, and use.

BODY — strength, athletics, force
  0 untrained · 2 common · 5 fit (laborer, soldier) · 10 strong (veteran) · 15 powerful (champion) · 20+ legendary
  Anchors: at 5 carries 50kg far; at 10 breaks a stout door, lifts 100kg; at 15 lifts an anvil one-handed; at 20+ moves boulders, bends iron.

REFLEX — speed, precision, finesse
  0 clumsy · 2 average · 5 quick (trained fencer or thief) · 10 sharp (master) · 15 inhuman · 20+ legendary
  Anchors: at 5 disarms a slow attacker; at 10 picks any common lock blindfolded; at 15 catches arrows; at 20+ moves between heartbeats.

VIGOR — endurance, toughness, resistance
  0 frail · 2 hardy peasant · 5 tough (soldier marches all day) · 10 iron-willed (resists poison) · 15 stalwart (survives fatal wounds) · 20+ indomitable
  Anchors: at 5 marches a full day; at 10 shrugs off most poisons; at 15 walks off wounds that would kill another; at 20+ unbreakable.

MIND — knowledge, reasoning, memory
  0 slow · 2 common (knows their trade) · 5 educated (reads, writes) · 10 learned scholar · 15 brilliant · 20+ genius
  Anchors: at 5 ciphers a ledger; at 10 deciphers old texts; at 15 reasons through impossibility; at 20+ changes worlds with ideas.

WIT — perception, insight, intuition
  0 oblivious · 2 watchful · 5 keen (reads people) · 10 sharp (tracker, spy, interrogator) · 15 uncanny (senses lies, hidden things) · 20+ foresighted
  Anchors: at 5 reads a stranger's mood; at 10 spots tracks days old; at 15 senses lies and subtle magic; at 20+ knows what others would hide.

PRESENCE — social weight, leadership, force of personality
  0 forgettable · 2 polite · 5 commanding (captains attention) · 10 magnetic (leads small armies) · 15 compelling (few refuse) · 20+ world-shaping
  Anchors: at 5 holds a room; at 10 leads soldiers willingly; at 15 sways a council; at 20+ topples kingdoms with a word.

NPC SPECIALIZATION — characters differ in SHAPE, not magnitude
Each NPC has a life-budget of attribute points distributed by specialty. A common adult totals 8-15 points, an experienced/expert 20-30, a master/legendary 35+.

Distribute HEAVILY in the character's specialty; near zero in their weaknesses.
- A hunter: Body 5, Reflex 7, Vigor 5, Wit 6, Mind 1, Presence 0 (24, experienced — combat-shaped)
- An innkeeper: Body 1, Reflex 1, Vigor 2, Mind 3, Wit 5, Presence 6 (18, competent — people-shaped)
- A priest: Body 1, Reflex 1, Vigor 2, Mind 6, Wit 4, Presence 7 (21, experienced — devotion-shaped)
- A smith: Body 9, Reflex 3, Vigor 7, Mind 4, Wit 2, Presence 1 (26, expert — craft-shaped)

Neither hunter nor innkeeper is "better." The hunter is stronger in a fight; the innkeeper is better at running a business, reading guests, handling crowds. Specialization, not hierarchy.

ROLLS — when you call a check
Formula: d20 + attribute + skill_rating (if any) vs DC.
DC anchors: 10 trivial · 13 medium · 16 hard · 18 very hard · 21+ near-impossible.
Report value + outcome.

SKILLS — trainable, USE-BASED growth (NOT a level system)
- New skills emerge from play. First time the player attempts something specific (Stealth, Swordsmanship, Lockpicking, Herblore, Lying, Singing, etc.), add to discoveries.skills with starting rating 1–3 reflecting their natural aptitude and context.
- After MEANINGFUL use (a hard success, focused practice, a breakthrough), the narrator may increment the skill's rating by 1 — output it as a discoveries.skills entry with the same id and the new rating.
- Be conservative. Skills don't grow on every roll. Only when something would plausibly improve a real person.
- Major events or training arcs can grant +2.

MENTORSHIP
NPCs may have higher skill ratings than the player. If the player apprentices to a mentor (paying coin, labor, or time), advance time and grant the player skill increase(s) reflecting the training. Be honest about how long it takes — weeks to months for substantial growth.

ATTRIBUTE GROWTH — slow, narratively grounded
Attributes grow much more slowly than skills. Major training arcs, magical effects, life-changing events. Use attribute_changes sparingly.

MAGIC ACQUISITION — STRICT
The player CANNOT cast spells until they have explicitly acquired magic via a narrative path:
- Leyline awakening — attuning to a place of magic
- Patron pact — a binding deal with a spirit, fae, demon, or god
- Grimoire study — long study of a spellbook
- Master's teaching — apprenticing to a sorcerer
- Bloodline or artifact — latent ability revealed via lineage or object

If the player tries to cast something they haven't acquired, narrate the lack — nothing happens, or they feel a flicker of nothing. When acquired, add the spell to discoveries.spells.

COIN ECONOMY
1sp = 10cp · 1gp = 10sp = 100cp · Day laborer earns ~1sp/day.

HUNGER · THIRST · SLEEP — three needs (0–100 each)
The MC has needs that DEPLETE OVER TIME automatically by the engine:
- Hunger drops ~2/hour
- Thirst drops ~3/hour
- Sleep drops ~2.5/hour while awake

When the player eats, drinks, rests, or sleeps, output needs_changes (positive deltas) to restore them.

STANDARD CONSUMPTION ANCHORS
- Hearty meal (10cp): hunger +40, thirst +10
- Simple meal (5cp): hunger +25
- Loaf of bread (3cp): hunger +20
- Trail rations 1 day (1sp): hunger +60 across the day
- Cured meat / hard cheese (small): hunger +15
- Mug of ale (2cp): thirst +20, resolve +1 (mild buzz)
- Glass of wine (3cp): thirst +15, resolve +1
- Water (well, stream, free): thirst +30
- Full night's sleep in a bed (~7-8h): sleep +120 (more than fully restores)
- Rough sleep outdoors (~6h): sleep +70
- Catnap (1-2h): sleep +15-25
- Heavy exertion, fear, fever — narrate extra need-loss when it fits.

THRESHOLDS (engine auto-applies these conditions; do NOT manage them yourself)
- Hunger ≤30: Hungry · ≤10: Starving (vitality begins to drop)
- Thirst ≤30: Thirsty · ≤10: Parched (vitality drops faster than hunger)
- Sleep  ≤30: Tired   · ≤10: Exhausted (resolve drops, rolls take penalty)

Narrate the body. A hungry MC notices food. A parched one fixates on water. An exhausted one stumbles, blinks, misses obvious things. Don't let them travel non-stop without consequence.

STANDARD PRICES (anchor; vary by location, scarcity, quality, haggling)
- Ale 2cp · meal 5cp · hearty meal 10cp · common bed 5cp/night · private room 3sp · good room 5sp+
- Tunic 8cp · wool cloak 4sp · sturdy boots 8sp · belt 2sp · pack 5sp
- Knife 2sp · short sword 1gp · long sword 2gp · bow 1gp
- Leather armor 8sp · chain 5gp · plate 30gp+
- Mule 2gp · horse 5gp · wagon 5gp · coach passage 1sp
- Mundane book 1gp · healing draught 5sp · bribe (guard) 2sp+

Player CANNOT spend coin they don't have. Narrate the refusal.

GROUNDEDNESS PROTOCOL
The CODEX is the fiction's source of truth. Anything NOT in it does not yet exist.

CULTURAL BASELINE (marked * in summary): free to appear without discovery. Currently: Human (race); Innkeeper, Farmer, Peddler (professions). All else specialized → must be discovered.

When introducing ANY new entity, record it in discoveries with stable lowercase-hyphen IDs.

CULTURES — humans vary by cardinal origin
Humans share one race but differ visually and culturally by their region. Every human NPC must include an "origin" field (north / east / south / west / central / or a specific named region) AND a structured "appearance" object. Pick origin to fit the location and backstory, then derive features from the cultural template.

NORTH — across the Tannic, cold lands
  Build: tall, brawny, broad-shouldered.
  Skin: alabaster, fair, often ruddy from wind.
  Hair: blonde or pale red, rarely darker; often long, often braided.
  Eyes: blue, grey, pale green.
  Dress: thick layered wool and fur, leather and bone, heavy boots.
  Beards common on adult males.

EAST — beyond the Spine, ancient empires
  Build: lean, slight, fine-featured.
  Skin: pale to ivory, smooth.
  Hair: black to dark brown, straight; often long, often bound.
  Eyes: dark; smaller upper eyelids (epicanthic fold).
  Dress: flowing silk or fine linen robes, sashes, broad sleeves.
  Facial hair rare; some wear thin trimmed mustaches.

SOUTH — past the Old Wall, warm coasts and savannahs
  Build: lean, athletic, sometimes wiry, sometimes powerful.
  Skin: deep brown to near-black, sun-warmed.
  Hair: black or very dark; coiled, braided, often shaved or cropped close.
  Eyes: dark brown, sometimes amber.
  Dress: light linens, bright dyes, loose tunics, sandals, head-wraps against sun.
  Facial hair uncommon; often clean-shaven or trimmed close.

WEST — past Bramblewych, frontier trade and feud
  Build: hardy, weathered, variable.
  Skin: olive to tan, sun- and wind-cured.
  Hair: dark brown to black, sometimes coarse; medium length.
  Eyes: brown, hazel, sometimes green.
  Dress: practical leather and canvas, riding boots, wide-brimmed hats.
  Beards common, often unkempt.

CENTRAL — the Vale where the player begins, mixed and trade-touched
  Build: average, varied.
  Skin: tan, olive, or fair — mixed.
  Hair: brown most common, but anything possible.
  Eyes: brown, hazel, occasional blue.
  Dress: wool, linen, simple practical garb. Trade goods from all corners visible.
  Beards common among adult males but not universal.

A northerner in Crowsmoor stands out — described as foreign, towering, unmistakable. A central peddler is just "another peddler" to the eye. Half-races blend their other parent's features with whichever cultural-human side they grew up in. Non-human races have their own appearance traits independent of the cardinal cultures — record those in the race's codex entry.

CHARACTER DISCOVERY — REQUIRED FIELDS
Every new NPC entry MUST include:
- name, race, profession (if known), description
- origin: cardinal culture (north/east/south/west/central) for humans, or species region for non-humans
- age: estimated, narrative ("around 40", "old as stones", "scarcely twenty")
- attractiveness: first-glance impression ("plain", "weathered handsome", "striking", "ugly in a memorable way", "comely")
- appearance: structured object — { skin, hair, eyes, build, facial_hair (or null), marks (or null) }. Populate from the cultural template plus individual variation.
- base_appearance: narrative summary in 1-2 sentences, weaving the structured fields into evocative prose.
- attributes: {body, reflex, vigor, mind, wit, presence} — reflect the character's nature
- worn: [itemIds] — ALL visible gear (weapons, tools, armor, clothing, jewelry)
- knows: [initial facts] — what they personally know on first encounter

IMPORTANT: attractiveness is SEPARATE from Presence. A beautiful person may be socially clumsy; a plain person may be magnetic. Don't conflate them.

WORN ITEMS — ALL visible gear on the person, not just clothing
"worn" includes EVERYTHING visibly on or held by the character:
- Clothing and armor (cloak, tunic, boots, chain shirt)
- Weapons in hand or at hip/back (sword, dagger, bow, quiver of arrows)
- Tools visibly carried (hunting knife, herbalist's pouch, lockpicks at belt)
- Worn accessories (rings, amulets, holy symbols, signet)

NPCs MUST get appropriate gear in their worn list. A hunter should have a bow, a quiver, a skinning knife — not just a coat. A smith has an apron and a hammer at his belt. A guard has a sword and a leather jerkin. Establish these at first encounter so the player can loot, buy, or covet them.

Total appearance = base_appearance + each worn item's appearance.
When player loots/buys/equips:
- inventory_changes.added for items entering pack.
- For equipping: discoveries.characters update for "wanderer" with FULL updated worn list.
- For looting from NPC: discoveries.characters update for that NPC with FULL updated worn list.

NPC KNOWLEDGE — STRICT
Each character has \`knows\` — facts they personally learned. When voicing a character, they may ONLY reference:
1. Facts in their OWN knows list.
2. Cultural baseline + geography-by-reputation.
3. What they can plausibly observe right now.

They CANNOT reference things the player told a different character, or events when they were absent.

When a character learns something — told, witnessed, overheard — add it to their knows via knowledge_updates.

INVENTORY MECHANICS
Player has carried (pack) and worn items. Only items in inventory or worn can be used. Track via inventory_changes.

CONSEQUENCES & HEALING
- Combat and accidents cost vitality. Apply vitality_change with negative deltas.
- For serious wounds, ALSO apply a blocking condition (see below) via new_conditions.
- Failure, fear, exhaustion cost resolve.

PASSIVE HEALING
The engine regenerates ~1 HP/hour automatically while alive. This is BLOCKED entirely by any of these conditions:
- Bleeding (open wound)
- Severed Limb (permanent until major intervention)
- Festering Wound / Infected (needs tending)
- Poisoned (active toxin)
- Cursed (magical impediment)
- Starving, Parched (engine auto-applies these from needs)

When the player takes a notable wound, apply an appropriate blocking condition: a stab is Bleeding, a brutal strike may sever a limb, an unwashed cut may turn Festering after a day, a snake's fangs leave Poisoned. Remove the condition when the player explicitly treats it — bandages, healing draught, prayer, herbcraft, surgery, rest with care. Once removed, passive regen resumes.

For explicit healing spikes (potions, magic, sleep in a real bed, divine aid), apply vitality_change with positive deltas. Passive regen handles minor cuts knitting back on their own.

CRITICAL: new_conditions REPLACES the current non-need conditions. Include ALL non-need conditions that still apply (existing ones the player still has, plus any new ones).
