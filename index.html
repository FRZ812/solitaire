<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Solitaire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: contain; }
    body {
      background-color: #0d1312;
      background-image: radial-gradient(circle at 50% 30%, #152422 0%, #0a0f0e 80%);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #EDE4D0;
    }
    input, button, textarea { font-family: inherit; }
    button { 
      -webkit-tap-highlight-color: transparent; 
      transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s, border-color 0.2s, opacity 0.2s;
    }
    button:active {
      transform: scale(0.96) !important;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .scale-in {
      animation: scaleIn 0.25s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }
    #root { height: 100dvh; }
    .scene-log::-webkit-scrollbar { display: none; }
    .tabstrip::-webkit-scrollbar { display: none; }
    .mapscroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .mapscroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(16, 23, 22, 0.2);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(215, 167, 111, 0.25);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(215, 167, 111, 0.45);
    }
    input:focus {
      border-color: rgba(215, 167, 111, 0.5) !important;
      box-shadow: 0 0 12px rgba(215, 167, 111, 0.2) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
