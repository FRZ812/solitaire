<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Solitaire</title>

  <!-- PWA / installable app metadata. Referenced files live in public/
       and are only meaningful for the web build; the artifact build's
       dist/index.html paste workflow silently ignores 404s for these. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <meta name="theme-color" content="#07101c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solitaire">
  <meta name="description" content="A browser-native mechanical high-fantasy RPG.">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: contain; }
    body {
      background-color: #0b2032;
      background-image:
        radial-gradient(circle at 50% 16%, rgba(111, 173, 204, .34), transparent 34%),
        radial-gradient(circle at 12% 78%, rgba(97, 148, 114, .16), transparent 34%),
        radial-gradient(circle at 88% 72%, rgba(207, 153, 81, .14), transparent 32%),
        linear-gradient(160deg, #153b50 0%, #0b2032 48%, #111d3a 100%);
      font-family: 'Alegreya', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #F7F1DE;
    }
    input, button, textarea { font-family: inherit; }
    button { 
      -webkit-tap-highlight-color: transparent; 
      transition: transform 140ms ease-out, background-color 140ms ease-out, border-color 140ms ease-out, opacity 140ms linear;
    }
    button:active {
      transform: translate(2px, 2px) !important;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .scale-in {
      animation: scaleIn 0.25s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }
    #root { height: 100dvh; }
    .scene-log::-webkit-scrollbar { display: none; }
    .tabstrip::-webkit-scrollbar { display: none; }
    .mapscroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .mapscroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(16, 23, 22, 0.2);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(215, 167, 111, 0.25);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(215, 167, 111, 0.45);
    }
    /* Scrolls, but with no visible scrollbar (character sheet). */
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    input:focus {
      border-color: rgba(215, 167, 111, 0.5) !important;
      box-shadow: 0 0 12px rgba(215, 167, 111, 0.2) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
